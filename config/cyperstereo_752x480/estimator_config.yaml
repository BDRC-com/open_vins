%YAML:1.0

# CyperStereo 752x480 stereo+IMU bring-up config.
#
# Notes:
# 1. Topics and IMU noise values are ported from jetson_config/euroc_old/euroc_stereo_imu_config.yaml.
# 2. The current camera/IMU calibration comes from the CyperstereoSDK OpenVINS config,
#    which provides a converted equidistant model consistent with the validated CyperStereo setup.

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 15
max_slam: 250
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.8001

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 50
zupt_max_disparity: 2.0
zupt_only_at_beginning: true

init_window_time: 2.0
init_imu_thresh: 0.45
init_max_disparity: 15.0
init_max_features: 50

init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/openvins_cyperstereo_timing.txt"

save_total_state: false
filepath_est: "/tmp/openvins_cyperstereo_estimate.txt"
filepath_std: "/tmp/openvins_cyperstereo_estimate_std.txt"
filepath_gt: "/tmp/openvins_cyperstereo_groundtruth.txt"

# Use KLT. This matches the CyperstereoSDK OpenVINS reference configuration.
use_klt: true
num_pts: 800
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.65
track_frequency: 21.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false
multi_threading_pubs: true

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
